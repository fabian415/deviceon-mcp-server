[project]
name = "deviceon-mcp"
version = "0.1.0"
description = "DeviceOn MCP Server (PoC): periodic CPU anomaly diagnosis and guarded process kill"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
deviceon-mcp = "deviceon_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
